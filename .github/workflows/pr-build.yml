# Compile + test every pull request before it can reach develop.
#
# The Build & Distribute workflow only runs on pushes to main/develop, so
# without this, the first compile of a PR's code happens AFTER merge — a broken
# PR turns develop red and halts Firebase distribution until fixed (this
# happened; see PR #43). This workflow gives every PR a build gate.
#
# Note: secrets are available here because PRs to this repo come from
# same-repo branches. PRs from forks would run without secrets and fail at the
# decode steps — acceptable for a personal repo.
name: PR Build & Test

on:
  pull_request:
    # claude/** is included so stacked PRs (a PR whose base is another PR's
    # branch) get the same build gate before their base ever merges.
    branches: [main, develop, "claude/**"]

# A new push to the same PR supersedes the previous run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Decode debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ${{ runner.temp }}/debug.keystore

      # jacocoFullReport depends on every module's testDebugUnitTest, so one
      # invocation runs the tests and merges their coverage — a failing test
      # still fails this step and the gate.
      - name: Run unit tests with coverage
        run: ./gradlew jacocoFullReport
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore

      - name: Post coverage summary
        run: python3 scripts/coverage_summary.py build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoFullReport/html

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
