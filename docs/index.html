<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PodBelly</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            background: #fdf6e3; color: #2b2b2b;
        }
        @media (prefers-color-scheme: dark) { body { background: #14110c; color: #f2ede1; } }
        .wordmark { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
        .belly { color: #e8792b; }
        @media (prefers-color-scheme: dark) { .belly { color: #f79a4d; } }
    </style>
</head>
<body>
    <div class="wordmark">pod<span class="belly">belly</span></div>
</body>
</html>
